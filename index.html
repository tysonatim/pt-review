<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to PT Review…</title>
  <noscript><meta http-equiv="refresh" content="0;url=https://www.imwebpros.com/pt-review/"></noscript>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.delete("s");
      var qs = params.toString();
      var target = "https://www.imwebpros.com/pt-review/" + (qs ? "?" + qs : "") + (window.location.hash || "");
      window.location.replace(target);
    })();
  </script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;background:#0b1120;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
  <p>Moved to <a id="lnk" href="https://www.imwebpros.com/pt-review/" style="color:#38bdf8">https://www.imwebpros.com/pt-review/</a></p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.delete("s");
      var qs = params.toString();
      var lnk = document.getElementById("lnk");
      if (lnk) lnk.href = "https://www.imwebpros.com/pt-review/" + (qs ? "?" + qs : "") + (window.location.hash || "");
    })();
  </script>
</body>
</html>
